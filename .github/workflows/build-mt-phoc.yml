name: Build MT-Phoc (Fedora-tested upstream baseline)

on:
  push:
    branches: [fedora-phoc-0.47.0]
  pull_request:
    branches: [fedora-phoc-0.47.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:testing
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates git meson ninja-build pkg-config build-essential
          printf 'Types: deb deb-src\nURIs: http://deb.debian.org/debian\nSuites: testing\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\n' > /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y phoc
          apt-get install -y xvfb xwayland xauth desktop-file-utils
      - name: Fetch Fedora-packaged upstream release
        run: |
          git clone --depth 1 --branch v0.47.0 https://github.com/PhoshMobi/phoc.git phoc-src
          cd phoc-src
          git log -1 --format='Source commit: %H%nRelease: %s'
      - name: Configure
        working-directory: phoc-src
        env:
          CFLAGS: -Wno-error=switch -Wno-error=discarded-qualifiers
        run: meson setup _build -Dembed-wlroots=enabled -Dxwayland=enabled -Dtests=false
      - name: Compile
        working-directory: phoc-src
        env:
          CFLAGS: -Wno-error=switch -Wno-error=discarded-qualifiers
        run: meson compile -C _build
      - name: Tests skipped
        run: echo "Tests intentionally skipped; build and package only."
      - name: Stage install tree
        working-directory: phoc-src
        run: DESTDIR="$GITHUB_WORKSPACE/stage" meson install -C _build --skip-subprojects
      - name: Package build
        run: tar -czf MT-phoc-linux-install.tar.gz -C stage .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT-phoc-0.47.0-arm64
          path: MT-phoc-linux-install.tar.gz
          if-no-files-found: error
