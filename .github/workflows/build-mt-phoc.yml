name: Build MT-Phoc

on:
  push:
    branches: [metmc-desktop-mode]
  pull_request:
    branches: [group/next/phosh-0.47]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential meson ninja-build pkg-config \
            libglib2.0-dev libgnome-desktop-3-dev \
            libinput-dev libudev-dev libdrm-dev libpixman-1-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libgles2-mesa-dev libwlroots-dev libxcb1-dev \
            libjson-glib-dev gsettings-desktop-schemas \
            xwayland xvfb xauth desktop-file-utils
      - name: Configure
        run: meson setup _build -Dembed-wlroots=disabled -Dxwayland=enabled
      - name: Compile
        run: meson compile -C _build
      - name: Test
        run: xvfb-run -a meson test -C _build --print-errorlogs
      - name: Stage install tree
        run: DESTDIR="$PWD/stage" meson install -C _build --skip-subprojects
      - name: Package build
        run: tar -czf MT-phoc-linux-install.tar.gz -C stage .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT-phoc-linux-install
          path: MT-phoc-linux-install.tar.gz
          if-no-files-found: error
